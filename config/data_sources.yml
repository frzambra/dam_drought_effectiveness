# Data source registry — external raw datasets that live outside the repo.
# Paths are absolute and machine-specific (external drive). Read these from code
# rather than hard-coding paths; mirror or symlink into data/raw/ as needed.

drought_indices:
  description: >
    Standardized drought indices (SPI, SPEI, EDDI) for Chile, derived from
    CHIRPS (precipitation) and CHIRTS (temperature) inputs. Monthly GeoTIFF
    rasters, one file per month per accumulation timescale.
  source: CHIRPS-CHIRTS
  reference_period: "1991-2026"          # baseline period used to standardize the indices
  root: /media/francisco/Respaldo_frzambra/data/drought/CHIRPS-CHIRTS/1991-2026/
  format: GeoTIFF (.tif)
  grid: Chile
  temporal_resolution: monthly

  # Directory layout:  <root>/<INDEX>/<INDEX>-<timescale>/<file>
  # e.g. .../1991-2026/SPI/SPI-3/chir[p|t]s_SPI-3_chile_1998-03-01.tif
  timescales_months: [1, 3, 6, 12, 24, 36]

  indices:
    SPI:
      subdir: SPI            # SPI/SPI-1 ... SPI/SPI-36
      span: ["1991-01-01", "2026-05-01"]   # 425 files per timescale
    SPEI:
      subdir: SPEI           # SPEI/SPEI-1 ... SPEI/SPEI-36
      span: ["1991-01-01", "2026-05-01"]   # 425 files per timescale
    EDDI:
      subdir: EDDI           # EDDI/EDDI-1 ... EDDI/EDDI-36
      span: ["1991-01-01", "2026-06-01"]   # 400-401 files (EDDI-1/-3 reach 2026-06)

  # FILENAME QUIRK: the literal prefix contains square brackets and a pipe,
  # "chir[p|t]s", which are glob/regex metacharacters. Do NOT match with a naive
  # wildcard. Pattern:  chir[p|t]s_<INDEX>-<scale>_chile_<YYYY-MM-01>.tif
  # In R, match with fixed strings or escape the brackets, e.g.:
  #   list.files(dir, pattern = "_SPI-3_chile_.*\\.tif$")   # key on the index token
  # rather than globbing the "chir[p|t]s" prefix.
  filename_pattern: "chir[p|t]s_{INDEX}-{TIMESCALE}_chile_{YYYY-MM-01}.tif"

# Annual aridity index (P / PET), CHIRPS-CHIRTS derived, 1981-2026. STATIC-ish climate
# descriptor: a watershed's mean aridity is a candidate MATCHING covariate (alongside
# Köppen, elevation), and the year-by-year series is a slow-moving aridification trend
# (drying baseline that drought anomalies ride on top of). NOT a standardized anomaly —
# it is the raw ratio, so low = arid, high = humid (opposite sign convention to SPI/SPEI).
aridity_index:
  description: >
    Annual aridity index (P/PET ratio) for Chile from the same CHIRPS-CHIRTS inputs as
    the standardized drought indices. One GeoTIFF per year. Dimensionless ratio, NOT a
    z-score: classify with UNEP bands (hyper-arid <0.05, arid 0.05-0.2, semi-arid 0.2-0.5,
    dry sub-humid 0.5-0.65, humid >0.65). Chile-wide median ~0.25 (semi-arid).
  source: CHIRPS-CHIRTS
  root: /media/francisco/Respaldo_frzambra/data/drought/CHIRPS-CHIRTS/1981-2026/aridity_index/
  format: GeoTIFF (.tif)
  grid: Chile (EPSG:4326)
  resolution_deg: 0.05
  dtype: Float32
  nodata: NaN                              # flagged nan; ~40% of grid is NA (ocean/void)
  units: dimensionless (P/PET ratio)

  annual:
    subdir: annual
    temporal_resolution: annual
    span: ["1981", "2026"]                 # 46 yearly rasters
    filename_pattern: "aridity_index_chir[p|t]s.chile.{YYYY}.tif"
  monthly:
    subdir: monthly
    temporal_resolution: monthly
    span: ["1981-01", "2026-05"]           # 545 files
    filename_pattern: "aridity_index_chir[p|t]s.chile.{YYYY.MM}.tif"

  notes: >
    Same "chir[p|t]s" filename quirk as the standardized indices (literal brackets/pipe are
    glob metacharacters — key on a fixed token like ".chile." or escape, do not naive-glob).
    Valid values run ~0.001..5.8; a handful of cells carry a spurious large-negative fill
    (~ -172.9) that is NOT flagged as NoData — MASK values < 0 to NA before zonal stats.
    gdalinfo reports STATISTICS_MEAN=-9999, which is stale placeholder stat metadata, not
    real data (zero -9999 cells). 2026 is a partial-year value; treat as provisional.
    Sign convention is OPPOSITE the SPI/SPEI anomalies (low aridity index = dry), so do not
    pool it with the standardized indices without re-signing.

# Ecological-drought OUTCOME indices, MODIS-derived. These are the impact/response
# variables (vegetation + actual ET) for H1's tail analysis and H2's mediator/outcome.
# All EPSG:4326, GeoTIFF. Standardized anomalies: negative = below-normal (drought stress).
ecological_indices:
  description: >
    MODIS-derived standardized ecological-drought indices for Chile.
  root: /media/francisco/Respaldo_frzambra/data/drought/MODIS/
  grid: Chile (EPSG:4326)

  products:
    zNPP:
      meaning: historical z-score of annual Net Primary Productivity (MOD17A3HGF)
      subdir: zNPP
      temporal_resolution: annual            # dated YYYY.01.01
      resolution_m: 500
      span: ["2000-01-01", "2025-01-01"]     # 26 files
      filename_pattern: "zNPP.MOD17A3HGF_Chile_500m_{YYYY.01.01}.tif"
    zcNDVI:
      meaning: z-score of accumulated NDVI
      subdir: zcNDVI
      temporal_resolution: monthly
      resolution_deg: 0.05
      timescales_months: [6]                 # ONLY the 6-month accumulation exists
      span: ["2000-02-01", "2025-07-01"]     # 307 files
      filename_pattern: "zcNDVI{TIMESCALE}_chile_{YYYY-MM-01}.tif"   # scale glued to name, no dash
    SETI:
      meaning: standardized anomaly of actual evapotranspiration (AET)
      subdir: SETI
      temporal_resolution: monthly
      resolution_deg: 0.05
      timescales_months: [1, 3, 6, 12, 24, 36]
      span: ["2000-01-01", "2024-12-01"]     # 300 files per timescale
      filename_pattern: "SETI-{TIMESCALE}_chile_{YYYY-MM-01}.tif"

# Annual land-cover / land-use, MapBiomas Chile Collection 2 (30 m). Tier-2 driver:
# land-cover trajectories, agricultural/irrigated-area expansion, silviculture, and
# the "induced demand" mechanism. One single-band classified raster per year.
landcover:
  description: >
    MapBiomas Chile Collection 2 annual land-cover/land-use classification at 30 m.
    Single-band categorical GeoTIFFs (class ID per pixel); legend in
    data/metadata/mapbiomas_legend.md.
  source: MapBiomas Chile (Colección 2)
  root: /media/francisco/Respaldo_frzambra/data/MapBiomas_v2.0/
  format: GeoTIFF (.tif)
  grid: Chile (EPSG:4326)
  resolution_deg: 0.000269494585236     # ~30 m
  resolution_m: 30
  dtype: Byte                            # categorical class IDs, not continuous
  nodata: 0                              # 0 = NoData fill (78.4% of the grid = outside Chile's land mask)
  temporal_resolution: annual
  span: ["1999", "2024"]                 # 26 yearly rasters
  filename_pattern: "mapbiomas_v2.0_{YYYY}.tif"

  # Class IDs (legend: data/metadata/mapbiomas_legend.md). Codes are raster pixel
  # values; level-1 parent classes and their level-2/3 children share the hierarchy.
  legend_file: data/metadata/mapbiomas_legend.md
  classes:
    1:  Forest formation (level 1)
    3:  Forest
    59: Primary forest
    60: Secondary forest
    67: Dwarf forest
    10: Natural non-forest formation (level 1)
    11: Wetland
    12: Grassland
    63: Steppe
    66: Shrubland
    29: Rocky outcrop
    14: Farming and silviculture (level 1)
    9:  Silviculture
    18: Agriculture
    15: Pasture
    22: Non-vegetated area (level 1)
    24: Infrastructure
    23: Beach, dune and sand spot
    61: Salt flat
    25: Other non-vegetated area
    26: Water bodies (level 1)
    33: River, lake or ocean
    34: Ice and snow
    27: Not observed
  notes: >
    Tier-2 analyses (demand expansion) key on classes 18 (Agriculture), 15 (Pasture)
    and 9 (Silviculture). 30 m is finer than the 0.05 deg / 500 m ecological indices
    and the index grids — aggregate to the analysis unit (watershed fractional cover)
    rather than working at the pixel.
    NODATA: verified by full raw scans of 1999/2010/2024 — value 0 is the only NoData
    (78.40% of the grid, identical every year = bounding box outside Chile's land mask);
    mask on 0. Legend class 27 ("Not observed") is effectively DEAD (0-21 px nationwide),
    so 0 and 27 are NOT interchangeable and there is no hidden "unobserved" population at
    27. Two UNDOCUMENTED codes appear at trace levels (79: ~4.6k px, 80: ~8.1k px in 2024;
    not in the legend) — treat as NoData / drop, do not pass through as real classes.

# Annual land cover, MODIS MCD12Q1 (Collection 6.1) IGBP scheme, ~500 m. Coarser,
# longer-running companion to MapBiomas; useful as an independent cross-check on
# land-cover trajectories and where MapBiomas's finer classes are noisy.
landcover_modis:
  description: >
    MODIS MCD12Q1.061 annual land-cover classification (IGBP / Land Cover Type 1),
    clipped to Chile at ~500 m. Single-band categorical GeoTIFFs (IGBP class per pixel).
  source: MODIS MCD12Q1 v061 (Land Cover Type 1, IGBP)
  root: /media/francisco/Respaldo_frzambra/data/MODIS/extraidos/IGBP.MCD12Q1.061_2001-2024_Chile_500m/
  format: GeoTIFF (.tif)
  grid: Chile (EPSG:4326)
  resolution_deg: 0.003332547773361     # ~500 m
  resolution_m: 500
  dtype: Int8                            # categorical IGBP class IDs (1-17)
  nodata: -128
  temporal_resolution: annual
  span: ["2001", "2024"]                 # 24 yearly rasters
  filename_pattern: "IGBP_Chile_{YYYY}.tif"

  # IGBP Land Cover Type 1 scheme (MCD12Q1 standard; pixel values 1-17).
  classes:
    1:  Evergreen needleleaf forests
    2:  Evergreen broadleaf forests
    3:  Deciduous needleleaf forests
    4:  Deciduous broadleaf forests
    5:  Mixed forests
    6:  Closed shrublands
    7:  Open shrublands
    8:  Woody savannas
    9:  Savannas
    10: Grasslands
    11: Permanent wetlands
    12: Croplands
    13: Urban and built-up lands
    14: Cropland/natural vegetation mosaics
    15: Permanent snow and ice
    16: Barren
    17: Water bodies
  notes: >
    For demand-expansion (Tier 2), the cropland signal is classes 12 (Croplands) and
    14 (Cropland/natural vegetation mosaics). Resolution (~500 m) matches the MODIS
    ecological indices but is ~16x coarser than MapBiomas (30 m); treat as a
    robustness cross-check on agricultural trajectories, not the primary land-cover
    source. NoData is -128 (Int8), distinct from MapBiomas's 0.

# SRTM digital elevation model (~90 m), Chile. STATIC matching covariate — mean elevation
# + relief per watershed. The key axis missing from the v1 matched set: it separates the
# high-Andes reservoir units (whose Köppen-ET "controls" are otherwise Patagonian) and
# sharpens the Mediterranean (C-group) matches. See docs/design/matched-controls.md.
dem:
  description: >
    SRTM 3-arc-second (~90 m) elevation for Chile, single-band Float32 GeoTIFF. Source of
    terrain matching covariates (mean elevation, within-unit relief/ruggedness).
  source: SRTM 3s (CGIAR/USGS)
  path: /media/francisco/Respaldo_frzambra/data/DEM/Chile_DEM_SRTM_3s.tif   # external drive (absolute)
  format: GeoTIFF (.tif)
  grid: Chile (EPSG:4326)
  resolution_deg: 0.000833333333333          # 3 arc-sec, ~90 m
  dtype: Float32
  nodata: NaN
  units: metres
  notes: >
    Valid elevation range in Chile is ~0..6928 m; the raster reports a spurious minimum of
    -630 m (ocean/void fill). Mask values < -100 m to NA before zonal stats. terra reads
    NaN as NA already; the < -100 guard catches the unflagged fill.

# Köppen-Geiger climate classification (Beck et al. 2023), 1991-2020 baseline. STATIC
# matching covariate / stratifier — assigns each watershed a climate zone so dammed vs
# undammed controls are compared within the same climate. Not a time series.
koppen_geiger:
  description: >
    Beck et al. (2023) high-resolution Köppen-Geiger climate maps, 1991-2020 normals.
    Single-band categorical GeoTIFFs (climate class per pixel, 1-30) with an embedded
    RGB palette; global extent, clip to Chile. Use as a watershed-level matching
    covariate (modal/dominant class) and for climate stratification of treatment effects.
  source: Beck et al. 2023, Scientific Data 10:724 (constrained CMIP6, 1 km)
  reference_period: "1991-2020"
  root: data/raw/climate_koppen_geiger/1991_2020/
  legend_file: data/raw/climate_koppen_geiger/legend.txt
  format: GeoTIFF (.tif)
  grid: Global (EPSG:4326)
  dtype: Byte
  nodata: 0
  temporal_resolution: static            # one map for the 1991-2020 normal period

  # Four resolutions shipped; pick by use. ~1 km is the analysis default for watershed
  # zonal stats; coarser ones are for context maps only.
  resolutions:
    "0p00833333": { file: koppen_geiger_0p00833333.tif, deg: 0.008333333333333, approx: "~1 km",  default: true }
    "0p1":        { file: koppen_geiger_0p1.tif,        deg: 0.1,               approx: "~11 km" }
    "0p5":        { file: koppen_geiger_0p5.tif,        deg: 0.5,               approx: "~55 km" }
    "1p0":        { file: koppen_geiger_1p0.tif,        deg: 1.0,               approx: "~110 km" }

  # Class IDs (legend.txt). Classes actually present over Chile (verified by tallying the
  # ~1 km map), most to least common: BWk(5) & BSk(7) cold desert/steppe ~57% (Atacama,
  # altiplano, Patagonian steppe); ET(29) ~16% (Andes/high latitude); Csb(9) ~9%
  # (Mediterranean central Chile); Cfb(15)+Cfc(16) ~9% (temperate south); BWh(4)/BSh(6)
  # hot arid far north; minor Ds/Dw/Df and EF(30). Cfa(14) and Csa(8) are negligible.
  classes:
    1:  {code: Af,  desc: "Tropical, rainforest"}
    2:  {code: Am,  desc: "Tropical, monsoon"}
    3:  {code: Aw,  desc: "Tropical, savannah"}
    4:  {code: BWh, desc: "Arid, desert, hot"}
    5:  {code: BWk, desc: "Arid, desert, cold"}
    6:  {code: BSh, desc: "Arid, steppe, hot"}
    7:  {code: BSk, desc: "Arid, steppe, cold"}
    8:  {code: Csa, desc: "Temperate, dry summer, hot summer"}
    9:  {code: Csb, desc: "Temperate, dry summer, warm summer"}
    10: {code: Csc, desc: "Temperate, dry summer, cold summer"}
    11: {code: Cwa, desc: "Temperate, dry winter, hot summer"}
    12: {code: Cwb, desc: "Temperate, dry winter, warm summer"}
    13: {code: Cwc, desc: "Temperate, dry winter, cold summer"}
    14: {code: Cfa, desc: "Temperate, no dry season, hot summer"}
    15: {code: Cfb, desc: "Temperate, no dry season, warm summer"}
    16: {code: Cfc, desc: "Temperate, no dry season, cold summer"}
    17: {code: Dsa, desc: "Cold, dry summer, hot summer"}
    18: {code: Dsb, desc: "Cold, dry summer, warm summer"}
    19: {code: Dsc, desc: "Cold, dry summer, cold summer"}
    20: {code: Dsd, desc: "Cold, dry summer, very cold winter"}
    21: {code: Dwa, desc: "Cold, dry winter, hot summer"}
    22: {code: Dwb, desc: "Cold, dry winter, warm summer"}
    23: {code: Dwc, desc: "Cold, dry winter, cold summer"}
    24: {code: Dwd, desc: "Cold, dry winter, very cold winter"}
    25: {code: Dfa, desc: "Cold, no dry season, hot summer"}
    26: {code: Dfb, desc: "Cold, no dry season, warm summer"}
    27: {code: Dfc, desc: "Cold, no dry season, cold summer"}
    28: {code: Dfd, desc: "Cold, no dry season, very cold winter"}
    29: {code: ET,  desc: "Polar, tundra"}
    30: {code: EF,  desc: "Polar, frost"}
  notes: >
    Matching grain: take the MODAL (most-frequent) class per watershed, or class-fraction
    vector for finer stratification — large Andean basins straddle several zones (arid
    valley floor to ET/EF crest). Reproject/clip the global ~1 km map to EPSG:4326 (already
    EPSG:4326) and extract against cuencas_dissolved/subcuencas_dissolved. NoData = 0
    (oceans); palette is cosmetic, key on the integer class ID.

# Watershed / sub-watershed boundaries — the ANALYSIS UNIT for treatment/control
# matching and zonal extraction of all rasters above (see data/raw/watersheds/).
# DGA Banco Nacional de Aguas (BNA) hydrographic divisions.
watersheds:
  description: >
    Chilean DGA Banco Nacional de Aguas (BNA) hydrographic boundaries: 139 cuencas
    (watersheds) and 489 subcuencas (sub-watersheds), nested. These are the spatial
    units for matched dammed-vs-undammed comparison and for zonal stats of the drought,
    ecological, and land-cover rasters. Replaces the interim dam-POINT extraction unit.
  source: DGA Chile — Banco Nacional de Aguas (BNA)
  crs: "SIRGAS-Chile (geographic)"        # GCS_SIRGAS-Chile; reproject to EPSG:4326 to match rasters
  geometry: Polygon
  full_extent: true                        # covers all Chile incl. insular/Antarctic territory; clip to mainland as needed

  cuencas:
    shapefile: data/raw/watersheds/watersheds_DGA/Cuencas_BNA.shp
    n_features: 139
    id_field: COD_CUEN                     # watershed code (BNA)
    name_field: NOM_CUEN
    region_fields: [REGION, COD_REGION]
  subcuencas:
    shapefile: data/raw/watersheds/subwatersheds_DGA/SubCuencas_BNA.shp
    n_features: 489
    id_field: COD_SUBC                     # sub-watershed code, nested under COD_CUEN
    parent_field: COD_CUEN                 # join sub -> parent watershed
    name_field: NOM_SUBC
    region_fields: [REGION, COD_REGION]

  notes: >
    Assign each reservoir to its containing unit by POINT-IN-POLYGON (spatial join of the
    reservoir points onto cuencas/subcuencas) — there is no attribute key linking the
    reservoir table to BNA codes. Decide cuenca vs subcuenca as the analysis grain: 489
    subcuencas give more matched control candidates and tighter spatial controls, 139
    cuencas give cleaner hydrologic closure (better for storage/streamflow balances).
    Same SIRGAS-Chile CRS as the reservoir points; reproject both to EPSG:4326 before
    extracting against the rasters.

# Reservoir join + spatial keys (see data/raw/reservoirs/).
reservoirs:
  levels_csv: data/raw/reservoirs/reservoirs_levels_2005-2026.csv   # comma-delimited, UTF-8, wide
  points_shapefile: data/raw/reservoirs/reservoirs_shapefile/Embalse_2026_05_31.shp
  # The shapefile is the national dam POINT registry (1370 features), NOT water-body polygons.
  # Join the 26 monitored reservoirs to their points by:  levels$ID_DGA == shapefile$CODEMBAL
  join_key: {levels: ID_DGA, shapefile: CODEMBAL}
  shapefile_crs: "SIRGAS-Chile (geographic)"     # reproject to EPSG:4326 to match rasters
  useful_point_attributes:
    ANOCONTR: construction year (treatment-timing proxy; some are 0 = unknown)
    USO_EMBAL: use (RIEGO = irrigation, etc. — for irrigation-vs-hydropower stratification)
    TAMANO: size class
    NOMREG: region
  notes: >
    Rungue has a blank max_level_hm3 (no capacity) -> percent-of-capacity undefined.
    Watershed boundaries are now available (see `watersheds:` above) — assign each
    reservoir to its containing cuenca/subcuenca by point-in-polygon to define the
    treatment unit, replacing the interim dam-POINT extraction.

# MOD16A2GF actual-ET, monthly, ~500 m — the native MODIS ET (finer than the 0.05° SETI
# anomaly product). Used for the reservoir ET-buffering test on orchard cells (slope of
# log annual ET on SPEI). Raw ET (scaled int, MODIS fill > 32760), NOT a standardized anomaly.
et_mod16:
  description: >
    MODIS MOD16A2GF.061 gap-filled actual evapotranspiration, aggregated to monthly, clipped to
    Chile at ~500 m. One GeoTIFF per month. Scaled integer (apply 0.1 for mm); MODIS fill codes
    > 32760 (water/void) must be masked. Known to UNDER-estimate irrigated-crop ET.
  root: /media/francisco/Respaldo_frzambra/data/MODIS/extraidos/ET.MOD16A2GF.061_monthly_2000-2025_Chile_500m/
  source: MODIS MOD16A2GF v061
  format: GeoTIFF (.tif)
  grid: Chile (EPSG:4326)
  resolution_deg: 0.00333          # ~370-500 m
  temporal_resolution: monthly
  span: ["2000-01", "2024-12"]     # 300 files; use 2001-2024 (drop partial 2000)
  filename_pattern: "ET.MOD16A2GF.061_monthly_{YYYYMMDD}.tif"
  nodata: ">32760"                 # MODIS fill (water/void); mask before stats

# CIREN/ODEPA Catastro Frutícola — DEFINITIVELY IRRIGATED fruit-orchard cadastre polygons.
# The ground-truth irrigated-agriculture layer: replaces the MapBiomas class-18 proxy for the
# transmission-slope irrigated stratum, and (via plantation year) reconstructs irrigated-area
# EXPANSION — the gated H2 induced-demand mediator.
catastro_fruticola:
  description: >
    CIREN/ODEPA Catastro Frutícola: irrigated perennial fruit-orchard polygons (cherry, table
    grape, blueberry, avocado, walnut, citrus, stone fruit, olive, ...). One survey per region
    every ~3-4 years; use each region's LATEST poligonos_<year> layer.
  root: /media/francisco/Respaldo_frzambra/data/vectorial/Catastro_fruticola/
  format: ESRI Shapefile           # per region: poligonos_<year>/cubierta_interseccion_*.shp
  crs: "EPSG:32719"                # UTM 19S, uniform across ALL regions; reproject to 4326
  geometry: MULTIPOLYGON
  n_regions: 12                    # Atacama→Los_Lagos + Aysén; latest years span 2021–2025
  totals: { polygons: 89683, area_ha_declared: 335384, area_ha_geometric: 379318 }
  attributes:
    ESPECIE: crop species
    "AñO DE PL": plantation year (orchard establishment) — column is "AñO PLANT" in Ñuble/Valpo
    SUPERFICIE: declared planted area (ha)
  processed: data/processed/orchards/orchards_{latest,dissolved}.gpkg   # built by read_orchards.R
  notes: >
    PERENNIAL FRUIT ONLY — a clean, definitively-irrigated SUBSET of agriculture; excludes
    annual crops/vegetables and wine grapes (separate vineyard cadastre). Dissolve in the native
    UTM (planar GEOS): the geographic s2 path fails on degenerate cadastre edges. Geometric
    footprint ~13% larger than declared SUPERFICIE (cover polygons exceed planted ha) — use
    geometry for masks, SUPERFICIE for reported area. plant_year ~8% missing with a 1900 fill
    for unknown. Latest-year SNAPSHOT; plant_year gives the time-varying / expansion view.
    19 of 21 matched dammed subcuencas contain orchards (median ~2170 ha) vs 46/244 controls
    (median ~216 ha) — reservoirs↔orchards strongly coupled.

# --- Notes ----------------------------------------------------------------
# - CHIRPS-CHIRTS indices begin 1991; MODIS ecological indices begin 2000; MapBiomas
#   land cover 1999; reservoir storage begins 2005-01. Usable multi-source overlap is
#   2005-01 onward; the forcing-only pre-period (for placebo/matching slopes) is
#   1991-2009 (MODIS only from 2000, land cover from 1999).
# - Sibling CHIRPS-CHIRTS datasets NOT used by default: top-level SPI/SPEI/EDDI on a
#   1998-2024 baseline, ET0/ (reference ET0, 1981-2026). The 1981-2026/aridity_index/ is
#   now registered above (annual + monthly). Register the others explicitly if needed.
